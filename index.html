<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>计算机学测 &middot; 知识点自测</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--text2:#6e6e73;--primary:#007aff;--correct:#34c759;--wrong:#ff3b30;--border:#e5e5ea;--radius:12px;--safe-bottom:env(safe-area-inset-bottom,0px)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:16px;line-height:1.6;padding-bottom:calc(80px + var(--safe-bottom));-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
.header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,0.72);backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:19px;font-weight:700;background:linear-gradient(135deg,#6366f1,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.progress{font-size:14px;color:var(--text2)}
.header-right{display:flex;align-items:center;gap:10px}
.header .about-btn{padding:7px 14px;border:1px solid var(--border);border-radius:20px;background:rgba(255,255,255,0.9);font-size:13px;font-weight:600;color:var(--text2);cursor:pointer;transition:all .2s;white-space:nowrap}
.header .about-btn:hover{border-color:var(--primary);color:var(--primary)}
.header .about-btn:active{transform:scale(0.95)}
.config-panel{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);z-index:200;overflow-y:auto;padding:24px 20px calc(80px + var(--safe-bottom));transition:transform .4s cubic-bezier(.4,0,.2,1)}
.config-panel.hidden{transform:translateY(100%);pointer-events:none}
.config-panel h2{font-size:22px;font-weight:700;margin:20px 0 14px}
.topic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-bottom:16px}
.topic-item{display:flex;align-items:center;background:var(--card);border:2px solid var(--border);border-radius:12px;padding:12px 14px;cursor:pointer;user-select:none;transition:all .2s cubic-bezier(.4,0,.2,1)}
.topic-item:hover{border-color:#c7d2fe;transform:translateY(-1px);box-shadow:0 4px 12px rgba(99,102,241,0.08)}
.topic-item:active{transform:scale(0.97)}
.topic-item.selected{border-color:var(--primary);background:#e8f0fe}
.topic-item input[type=checkbox]{width:20px;height:20px;accent-color:var(--primary);margin-right:10px;flex-shrink:0;pointer-events:none;opacity:0}
.topic-item.selected input[type=checkbox]{opacity:1}
.topic-item label{font-size:14px;font-weight:500;cursor:pointer;flex:1;min-width:0;line-height:1.4;white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:break-word;word-break:break-word;display:block}
.topic-count{font-size:12px;font-weight:600;color:var(--text2);background:var(--bg);border-radius:20px;padding:2px 10px;margin-left:6px;flex-shrink:0}
.config-actions{display:flex;gap:10px;margin:16px 0}
.config-actions button{flex:1;padding:10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--card);font-size:14px;cursor:pointer}
.start-btn{width:100%;padding:16px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border:none;border-radius:14px;font-size:17px;font-weight:600;cursor:pointer;box-shadow:0 4px 16px rgba(99,102,241,0.25);transition:all .2s}
.start-btn:active{transform:scale(0.97);box-shadow:0 2px 8px rgba(99,102,241,0.2)}
.start-btn:disabled{opacity:.4;pointer-events:none;box-shadow:none}
.start-btn:disabled{opacity:.4;pointer-events:none}
.question-area{padding:16px 20px;max-width:680px;margin:0 auto}
.q-card{background:var(--card);border-radius:var(--radius);padding:24px 20px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04);animation:fadeSlide .35s cubic-bezier(.4,0,.2,1)}
@keyframes fadeSlide{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.q-meta{font-size:13px;font-weight:500;color:var(--text2);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.q-number{font-weight:700;color:var(--primary);background:var(--primary-light);padding:2px 10px;border-radius:20px;font-size:12px}.multi-badge{display:inline-block;font-size:11px;font-weight:700;background:#f59e0b;color:#fff;padding:1px 7px;border-radius:4px;margin-left:6px;vertical-align:middle}
.q-text{font-size:18px;font-weight:500;line-height:1.8;margin-bottom:20px;color:var(--text)}
.options{display:flex;flex-direction:column;gap:10px}
.option-btn{display:flex;align-items:flex-start;padding:14px 16px;border:2px solid var(--border);border-radius:12px;background:var(--card);font-size:15px;line-height:1.5;cursor:pointer;text-align:left;width:100%;user-select:none;transition:all .2s cubic-bezier(.4,0,.2,1)}
.option-btn:hover{border-color:#c7d2fe;background:#fafaff}
.option-btn:active{transform:scale(0.98)}
.option-btn .label{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;border:2px solid var(--border);font-size:14px;font-weight:600;margin-right:12px;flex-shrink:0;transition:all .2s}
.option-btn:not(.correct):not(.wrong):not(.show-answer):hover .label{border-color:var(--primary);color:var(--primary)}
.option-btn.correct{border-color:var(--correct);background:var(--correct-bg)}
.option-btn.correct .label{background:var(--correct);border-color:var(--correct);color:#fff}
.option-btn.wrong{border-color:var(--wrong);background:var(--wrong-bg)}
.option-btn.wrong .label{background:var(--wrong);border-color:var(--wrong);color:#fff}
.option-btn.show-answer{border-color:var(--correct);background:var(--correct-bg)}
.option-btn.show-answer .label{background:var(--correct);border-color:var(--correct);color:#fff}.option-btn.selected{border-color:var(--primary);background:var(--primary-light);box-shadow:0 0 0 1px var(--primary)}
.answer-bar{background:var(--card);border-radius:var(--radius);padding:16px 20px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04);display:flex;align-items:center;justify-content:space-between;gap:10px}
.answer-text{font-size:15px;font-weight:500}
.answer-text .ans-label{color:var(--text2);margin-right:4px}
.answer-text .ans-value{color:var(--correct);font-weight:700;font-size:16px}
.answer-bar .answer-text{flex:1;min-width:0}
.answer-bar .toggle-ans-btn{flex-shrink:0}
.toggle-ans-btn{padding:8px 18px;border:2px solid var(--border);border-radius:10px;background:var(--card);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;transition:all .2s;color:var(--text2)}
.toggle-ans-btn:hover{border-color:var(--primary);color:var(--primary)}
.toggle-ans-btn:active{transform:scale(0.95)}
.submit-hint{background:#fff7e6;border:1px solid #f0c36d;border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:14px;line-height:1.5;color:#7a5200}
.action-bar{position:fixed;bottom:0;left:0;right:0;padding:12px 20px calc(12px + var(--safe-bottom));background:rgba(255,255,255,0.78);backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);border-top:1px solid var(--border);display:flex;gap:10px;z-index:100}
.action-bar button{flex:1;padding:13px 16px;border:2px solid var(--border);border-radius:14px;background:var(--card);font-size:15px;font-weight:600;cursor:pointer;transition:all .2s;color:var(--text)}
.action-bar button:hover{border-color:#c7d2fe;background:#fafaff}
.action-bar button:active{transform:scale(0.97)}
.action-bar .primary-btn:hover{background:#4f46e5;border-color:#4f46e5}
.action-bar .primary-btn{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 4px 12px rgba(99,102,241,0.25)}
.action-bar .config-btn{flex:0 0 auto;padding:13px 18px}
.stats-bar{text-align:center;font-size:13px;color:var(--text2);padding:6px 16px;margin-bottom:20px}
.stats-bar span{margin:0 8px}
.stats-bar .correct-count{color:var(--correct);font-weight:600}
.stats-bar .wrong-count{color:var(--wrong);font-weight:600}
.finish-screen{text-align:center;padding:80px 20px}
.finish-screen .emoji{font-size:48px;margin-bottom:16px}
.finish-screen h2{font-size:28px;font-weight:700;margin-bottom:12px}
.finish-screen .score{font-size:64px;font-weight:800;background:linear-gradient(135deg,#6366f1,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px}
.finish-screen .btn-again:hover{transform:translateY(-2px);box-shadow:0 6px 28px rgba(99,102,241,0.4)}.wrong-section{margin:24px 0 16px;text-align:left}.wrong-section h3{font-size:18px;font-weight:700;margin-bottom:12px;color:var(--wrong)}.wrong-opt{font-size:13px;color:var(--text2);padding:2px 0 2px 12px;line-height:1.5}.wrong-list{display:flex;flex-direction:column;gap:10px}.wrong-item{background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:12px 14px}.wrong-q{font-size:14px;font-weight:500;margin-bottom:6px;line-height:1.5;color:var(--text)}.wrong-answer{font-size:13px;color:var(--wrong);margin-bottom:2px}.correct-answer{font-size:13px;color:var(--correct)}
.finish-screen .btn-again:active{transform:scale(0.97)}
.review-section{margin:24px 0 16px;text-align:left}
.review-section h3{font-size:18px;font-weight:700;margin-bottom:12px;color:var(--text)}
.review-list{display:flex;flex-direction:column;gap:10px}
.review-item{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--border);border-radius:10px;padding:12px 14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.review-item.review-correct{border-left-color:var(--correct)}
.review-item.review-wrong{border-left-color:var(--wrong)}
.review-q{font-size:14px;font-weight:600;margin-bottom:4px;line-height:1.5;color:var(--text)}
.review-meta{font-size:12px;color:var(--text2);margin-bottom:6px}
.review-line{font-size:13px;line-height:1.7;word-break:break-all}
.review-line .user-right{color:var(--correct);font-weight:600}
.review-line .user-wrong{color:var(--wrong);font-weight:600}
.review-line .right-ans{color:var(--correct);font-weight:700}
.finish-screen .btn-again{margin-top:8px;padding:16px 48px;background:var(--primary);color:#fff;border:none;border-radius:14px;font-size:17px;font-weight:600;cursor:pointer;transition:all .2s;box-shadow:0 4px 20px rgba(99,102,241,0.3)}
.empty-state{text-align:center;padding:100px 20px;color:var(--text2)}
.empty-state h2{font-size:20px;margin-bottom:8px;color:var(--text)}
.about-config{position:absolute;top:max(18px, calc(env(safe-area-inset-top, 0px) + 8px));right:16px;padding:8px 16px;border:1px solid var(--border);border-radius:20px;background:var(--card);font-size:13px;font-weight:600;color:var(--text2);cursor:pointer;transition:all .2s;z-index:5}
.about-config:hover{border-color:var(--primary);color:var(--primary)}
.about-config:active{transform:scale(0.96)}
.about-mask{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .25s cubic-bezier(.4,0,.2,1)}
.about-mask.show{opacity:1;pointer-events:auto}
.about-dialog{background:var(--card);border-radius:18px;max-width:380px;width:100%;padding:26px 22px 20px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.25);transform:translateY(14px) scale(0.96);transition:transform .25s cubic-bezier(.4,0,.2,1)}
.about-mask.show .about-dialog{transform:translateY(0) scale(1)}
.about-icon{font-size:34px;margin-bottom:8px}
.about-title{font-size:21px;font-weight:800;background:linear-gradient(135deg,#6366f1,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:14px}
.about-info{margin:4px 0 18px;text-align:left;font-size:14px;color:var(--text);line-height:1.9}
.about-info p{word-break:break-all}
.about-label{color:var(--text2);font-weight:600;margin-right:2px}
.about-info a{color:var(--primary);text-decoration:none}
.about-info a:active{opacity:0.7}
.about-close-btn{width:100%;padding:12px 16px;border:none;border-radius:12px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s}
.about-close-btn:active{transform:scale(0.97)}
</style>
</head>
<body>
<div class="header" id="header"><h1>学测自测</h1><div class="header-right"><div class="progress" id="progress">0/0</div><button class="about-btn" onclick="openAbout()">关于</button></div></div>

  <div class="config-actions"><button onclick="selectAll(1)">全选</button><button onclick="selectAll(0)">取消全选</button></div>

</div>

    var selArr2=userAnswers[idx]||[];var isCor=q.answer.indexOf("正确")>=0||q.answer==="对";
    [["正确",isCor],["错误",!isCor]].forEach(function(pair){
      var cls="option-btn",val=pair[0],isSel2=selArr2.indexOf(val)>=0;
      if(showAns){if(isSel2&&pair[1]){cls+=" correct"}else if(isSel2&&!pair[1]){cls+=" wrong"}else if(isRev&&pair[1]){cls+=" show-answer"}}else if(isSel2){cls+=" selected"};
      html+=`<div class="${cls}" onclick="selectJudge(${idx},\'${val}\')" style=flex:1><span>${val}</span></div>`;
    });
    html+="</div>";
  }
  html+="</div><div class=answer-bar>";
  if(isExam){
    html+="<div class=answer-text><span class=ans-label>考试模式：提交试卷后统一展示答案与解析</span></div>";
  }else if(showAns){
    html+="<div class=answer-text><span class=ans-label>答案：</span><span class=ans-value>"+esc(q.answer)+"</span></div>";
    html+="<button class=toggle-ans-btn onclick=toggleAns("+idx+")>隐藏答案</button>";
  }else{
    html+="<div class=answer-text><span class=ans-label>答案提示已隐藏</span></div><button class=toggle-ans-btn onclick=toggleAns("+idx+")>显示答案</button>"
  }
  html+="</div>";
  area.innerHTML=(hint?'<div class=submit-hint>'+esc(hint)+'</div>':"")+html;
  document.getElementById("nextBtn").textContent=isExam?(currentIndex===session.length-1?"提交试卷":"下一题"):(currentIndex===session.length-1?"完成 &#10003;":"下一题");
}
function selectOpt(idx,key){var a=userAnswers[idx]||[];var i=a.indexOf(key);if(i>=0)a.splice(i,1);else a.push(key);userAnswers[idx]=a;if(examMode!=="exam")revealed[idx]=true;renderQuestion()}
function selectJudge(idx,val){var a=userAnswers[idx]||[];var i=a.indexOf(val);if(i>=0)a.splice(i,1);else a.push(val);userAnswers[idx]=a;if(examMode!=="exam")revealed[idx]=true;renderQuestion()}
function toggleAns(idx){if(examMode==="exam")return;revealed[idx]=!revealed[idx];renderQuestion()}
function nextQuestion(){if(currentIndex<session.length-1){currentIndex++;submitHint="";renderQuestion();return}if(examMode==="exam"){submitExam();return}isFinished=1;renderQuestion();document.getElementById("actionBar").style.display="none"}
function prevQuestion(){if(currentIndex>0){currentIndex--;submitHint="";renderQuestion()}}
function submitExam(){
  var miss=[];
  for(var i=0;i<session.length;i++){if(!(userAnswers[i]||[]).length)miss.push(i)}
  if(miss.length){currentIndex=miss[0];submitHint="还有 "+miss.length+" 题未作答，请完成后再提交试卷";renderQuestion();return}
  isFinished=1;document.getElementById("actionBar").style.display="none";renderQuestion();
}
function renderFinish(area){
  var isExam=examMode==="exam",tot=session.length,cor=0,wrongArr=[],review=[];
  for(var i=0;i<session.length;i++){
    var q=session[i],a=(userAnswers[i]||[]).slice().sort().join(","),b=q.answer.split("、").slice().sort().join(",");
    var answered=(userAnswers[i]||[]).length>0,ok=answered&&a===b;
    if(ok)cor++;else wrongArr.push({idx:i,q:q,user:(userAnswers[i]||[]).join("、")});
    review.push({idx:i,q:q,user:(userAnswers[i]||[]).join("、"),ok:ok,answered:answered});
  }
  var rate=tot?Math.round(cor/tot*100):0,emo=rate>=90?"🏆":rate>=70?"👍":rate>=50?"💪":"📚";
  document.getElementById("progress").textContent=session.length+"/"+session.length;
  var wh="";
  wrongArr.forEach(function(w){var oh="",ok=Object.keys(w.q.options);ok.forEach(function(o){oh+="<div class=wrong-opt>"+o+". "+esc(w.q.options[o])+"</div>"});wh+="<div class=wrong-item><div class=wrong-q>#"+(parseInt(w.idx)+1)+" "+esc(w.q.question.substring(0,70))+"...</div>"+oh+"<div class=wrong-answer>你的答案: "+esc(w.user||"未作答")+"</div><div class=correct-answer>正确答案: "+esc(w.q.answer)+"</div></div>"});
  var ws=(!isExam&&wrongArr.length)?"<div class=wrong-section><h3>错题回顾 ("+wrongArr.length+")</h3><div class=wrong-list>"+wh+"</div></div>":"";
  var rl="";
  review.forEach(function(r){
    var userTxt=r.user||"未作答",userDetail=optContent(r.q,userTxt),ansDetail=optContent(r.q,r.q.answer),hasOpts=Object.keys(r.q.options).length>0;
    var mark=!r.answered?"未作答":(r.ok?"答对":"答错"),userShow=r.answered&&hasOpts&&userDetail?"（"+esc(userDetail)+"）":"",ansShow=hasOpts&&ansDetail?"（"+esc(ansDetail)+"）":"";
    rl+="<div class=\"review-item "+(r.ok?"review-correct":"review-wrong")+"\">"
      +"<div class=review-q>#"+(r.idx+1)+" "+esc(r.q.question)+"</div>"
      +"<div class=review-meta>"+esc(r.q.topic)+(r.q.answer.indexOf("、")>=0?" &middot; 多选":"")+"</div>"
      +"<div class=review-line><span class=\""+(r.ok?"user-right":"user-wrong")+"\">你的答案："+esc(mark)+"</span>"+userShow+"</div>"
      +"<div class=review-line><span class=right-ans>正确答案："+esc(r.q.answer)+"</span>"+ansShow+"</div>"
      +"</div>";
  });
  var rs=(isExam&&session.length)?"<div class=review-section><h3>全部题目 · 答案与解析</h3><div class=review-list>"+rl+"</div></div>":"";
  area.innerHTML="<div class=finish-screen><div class=emoji>"+emo+"</div><h2>"+(isExam?"考试完成！":"答题完成！")+"</h2><div class=score>"+rate+"%</div><div class=score-label>正确率</div><p>共 "+session.length+" 题，答对 "+cor+" 题</p>"+rs+ws+"<button class=btn-again onclick=showConfig()>再来一轮</button></div>"
}
function showConfig(){
  document.getElementById("configPanel").classList.remove("hidden");
  document.getElementById("actionBar").style.display="none";
  document.getElementById("questionArea").innerHTML="";document.getElementById("progress").textContent="0/0";
  isFinished=0;session=[];currentIndex=0;userAnswers={};revealed={};
}
function openAbout(){document.getElementById("aboutModal").classList.add("show")}
function closeAbout(){document.getElementById("aboutModal").classList.remove("show")}
document.addEventListener("DOMContentLoaded",initConfig);
</script>
</body>
</html>
